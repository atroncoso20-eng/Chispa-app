<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e11d48" />
  <meta name="description" content="Chispa - App de citas para hombres y mujeres mayores de 18 años." />
  <title>Chispa +18 | Citas para Hombres y Mujeres</title>
  <style>
    :root { --bg: #0f172a; --surface: #1e293b; --primary: #e11d48; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
    .app-shell { width: 100%; max-width: 460px; min-height: 100vh; background: #0b1120; display: flex; flex-direction: column; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b; position: relative; }
    header { padding: 14px 16px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-weight: 800; font-size: 1.35rem; display: flex; align-items: center; gap: 8px; }
    .brand-badge { background: var(--primary); color: white; font-size: 0.72rem; padding: 2px 7px; border-radius: 999px; }
    main { flex: 1; padding: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.95); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-card { background: var(--surface); border: 1px solid #334155; border-radius: 20px; padding: 24px; width: 100%; max-width: 400px; text-align: left; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    .form-group input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: var(--bg); color: white; font-size: 0.92rem; }
    .btn-primary { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    .error-msg { color: #fca5a5; font-size: 0.82rem; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="brand"><span>✨ Chispa</span><span class="brand-badge">+18</span></div>
    </header>
    <main>
      <h2>¡Chispa +18 en Línea!</h2>
      <p style="color: var(--muted); margin-top: 10px;">Aplicación de citas para hombres y mujeres configurada con éxito.</p>
    </main>
  </div>
  <div class="modal-backdrop" id="ageGateModal">
    <div class="modal-card">
      <span class="brand-badge" style="display:inline-block; margin-bottom:10px;">ACCESO EXCLUSIVO +18</span>
      <h2>Verificación de Edad</h2>
      <p style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 16px;">Ingresa tu fecha de nacimiento para continuar.</p>
      <div class="form-group">
        <label>Fecha de Nacimiento</label>
        <input type="date" id="dobInput" />
      </div>
      <div class="error-msg" id="ageErrorMsg"></div>
      <button class="btn-primary" onclick="verifyAge()">Confirmar y Entrar (+18)</button>
    </div>
  </div>
  <script>
    function verifyAge() {
      const dobVal = document.getElementById("dobInput").value;
      const err = document.getElementById("ageErrorMsg");
      if (!dobVal) { err.textContent = "Por favor ingresa tu fecha de nacimiento."; err.style.display = "block"; return; }
      const dob = new Date(dobVal);
      const today = new Date();
      let age = today.getFullYear() - dob.getFullYear();
      const m = today.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
      if (age < 18) { err.textContent = "Acceso denegado: Debes tener 18 años o más."; err.style.display = "block"; return; }
      document.getElementById("ageGateModal").style.display = "none";
    }
  </script>
</body>
</html>
